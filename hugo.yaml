baseurl: https://redamancy0918.github.io/
languageCode: zh-cn
theme: hugo-theme-stack
title: 秋風的技术博客
copyright: 秋風

contentDir: content
DefaultContentLanguage: zh-cn
hasCJKLanguage: true

languages:
    zh-cn:
        languageName: 简体中文
        title: 秋風的技术博客
        weight: 1
        params:
            sidebar:
                subtitle: 记录与分享

pagination:
    pagerSize: 5

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true

    footer:
        since: 2026

    dateFormat:
        published: 2006-01-02
        lastUpdated: 2006-01-02 15:04

    sidebar:
        emoji: 🍥
        subtitle: 记录与分享
        avatar:
            enabled: true
            local: true
            src: img/avatar.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: false

    comments:
        enabled: false
        provider: giscus

        giscus:
            repo: Redamancy0918/Redamancy0918.github.io
            repoID: R_kgDOOnDaIQ
            category: Announcements
            categoryID: DIC_kwDOOnDaIc4CZYm3
            mapping: pathname
            lightTheme: light
            darkTheme: dark_dimmed
            reactionsEnabled: 1
            emitMetadata: 0

        waline:
            serverURL:
            lang: zh-CN
            pageview: true
            emoji:
                - https://unpkg.com/@waline/emojis@1.0.1/weibo
            requiredMeta:
                - name
                - email
                - url
            locale:
                admin: 博主
                placeholder: 说点什么吧...

        twikoo:
            envId:
            region: ap-shanghai
            path: pathname
            lang: zh-CN

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            site:
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        toggle: true
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

menu:
    main:
        - identifier: home
          name: 主页
          url: /
          weight: 1
          params:
              icon: home
        - identifier: archives
          name: 归档
          url: /archives/
          weight: 2
          params:
              icon: archives
        - identifier: search
          name: 搜索
          url: /search/
          weight: 3
          params:
              icon: search
        - identifier: links
          name: 友链
          url: /links/
          weight: 4
          params:
              icon: link
        - identifier: about
          name: 关于
          url: /about/
          weight: 5
          params:
              icon: user

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/Redamancy0918
          params:
              icon: brand-github

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100
        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
